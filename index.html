<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>messthon-git</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loginView" class="login-view">
  <div class="login-card">
    <div class="brand">messthon-git</div>
    <h1>Sign in</h1>
    <p class="muted">Sign in with your GitHub account. Your identity is verified via GitHub OAuth.</p>
    <button id="githubLoginBtn" class="btn primary wide github-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.305-.536-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0112 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/></svg>
      <span>Continue with GitHub</span>
    </button>
    <div id="loginError" class="error"></div>
    <div class="fineprint">Private storage. Files up to 1 GB. No email, no password.</div>
  </div>
</div>

<div id="appView" class="app" hidden>
  <header class="topbar">
    <div class="brand">messthon-git</div>
    <div class="top-right">
      <span id="meLabel" class="me"></span>
      <button id="logoutBtn" class="btn">Sign out</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-head">
        <span>Chats</span>
        <button id="newDmBtn" class="btn small">New</button>
      </div>
      <div id="convList" class="conv-list"></div>
    </aside>

    <main class="main">
      <div class="main-head">
        <div class="conv-title" id="convTitle">general</div>
        <div class="online"><span id="connectionIndicator" title="Connecting...">🟡</span> <span id="onlineLabel"></span></div>
      </div>

      <div id="messages" class="messages"></div>

      <div id="uploadBar" class="upload-bar" hidden>
        <div class="upload-text" id="uploadText"></div>
        <div class="progress"><div id="uploadFill"></div></div>
      </div>

      <div class="composer">
        <label class="attach">
          Attach
          <input type="file" id="fileInput" hidden>
        </label>
        <textarea id="messageInput" rows="1" placeholder="Message"></textarea>
        <button id="sendBtn" class="btn primary">Send</button>
      </div>
    </main>
  </div>
</div>

<div id="dmModal" class="modal" hidden>
  <div class="modal-card">
    <h2>New message</h2>
    <label for="dmInput">GitHub username</label>
    <input id="dmInput" spellcheck="false" placeholder="octocat">
    <div id="dmError" class="error"></div>
    <div class="modal-actions">
      <button id="dmCancel" class="btn">Cancel</button>
      <button id="dmStart" class="btn primary">Start chat</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
